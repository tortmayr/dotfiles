# ----- general settings -------------------------------------------------------

set -g default-terminal "tmux-256color"
set -g extended-keys on
set -ag terminal-overrides ",xterm*:Tc"
set -ag terminal-overrides ",*256col*:Tc"
set -ag terminal-features "xterm-kitty:RGB:usstyle"
set -g default-shell "/usr/bin/zsh"
set -g default-command "/usr/bin/zsh -i"
set -sg escape-time 0   # faster command sequences
set -sg repeat-time 600 # increase repeat timeout
set -s focus-events on # enable focus events for better terminal integration
set -g allow-passthrough on # allow mouse events to pass through to applications

setw -q -g utf8 on 

set -g history-limit 50000 # boost history

set -g mouse on # Enable mouse mode (tmux 2.1 and above)
bind m set -g mouse # toggle mouse on/off

# ----- display ------------------------------------------------------------

set -g base-index 1       # start windows numbering at 1
setw -g pane-base-index 1 # make pane numbering consistent with windows

setw -g automatic-rename on # rename window to reflect current program
set -g renumber-windows on  # renumber windows when a window is closed

set -g set-titles on # set terminal title
set -g set-titles-string " #S - #W"

set -g display-panes-time 800 # slightly longer pane indicators display time
set -g display-time 1000      # slightly longer status messages display time

set -g status-interval 10 # redraw status line every 10 seconds
set -ga terminal-features "*:hyperlinks" # enable terminal hyperlinks (tmux 3.2+)

# ----- key bindings --------------------------------------------------------
set -g prefix2 C-a      # Use C-a as secondary prefix key
bind C-a send-prefix -2 # Use C-a as a second prefix key

bind v split-window -v -c "#{pane_current_path}" # split current window horizontally
bind b split-window -h -c "#{pane_current_path}" # split current window vertically

bind , swap-pane -D      # swap current pane with the next one
bind . swap-pane -U      # swap current pane with the previous one

# siwtch panes using Alt-arrow without prefix
bind -n M-left select-pane -L
bind -n M-right select-pane -R
bind -n M-up select-pane -U
bind -n M-down select-pane -D

# pane resizing (arrow keys)
# Pane resizing with Shift + Arrow Keys
bind -r S-Left resize-pane -L 2
bind -r S-Down resize-pane -D 2
bind -r S-Up resize-pane -U 2
bind -r S-Right resize-pane -R 2

bind S command-prompt -p "New Session:" "new-session -A -s '%%'" # Create new session or attach if it exists
bind K confirm kill-session # Confirm before killing session
bind c new-window -c "#{pane_current_path}" # Create new window in current pane's directory

# Popup keybindings
bind g run-shell 'tmux display-popup -E -e PARENT_PID=#{pane_pid} -w 98% -h 98% "zsh -i -c '\''openLazygit \"$(tmux display-message -p -F "#{pane_current_path}")\"'\''"'
bind e run-shell 'code "$(tmux display-message -p -F "#{pane_current_path}")"'
bind s display-popup -E -w 40% -h 40% "$HOME/.local/bin/tmux-manager"
bind y display-popup -E -w 60% -h 50% "$HOME/.local/bin/ya"
bind G run-shell 'f="/tmp/wt_result.#{pane_id}"; rm -f "$f"; tmux display-popup -E -e WORKTREE_POPUP_RESULT="$f" -w 60% -h 60% -d "#{pane_current_path}" "$HOME/.local/bin/worktree"; [ -s "$f" ] && tmux send-keys -t "#{pane_id}" C-u && tmux send-keys -l -t "#{pane_id}" "cd '\''$(cat "$f")'\''" && tmux send-keys -t "#{pane_id}" Enter; rm -f "$f"'


# Clear screen and tmux scrollback buffer
bind -n C-l send-keys C-l \; run 'sleep 0.2' \; clear-history

# ----- copy mode & scrollback ------------------------------------------------
set -g mode-keys emacs # use emacs keybindings in copy mode

# Scroll up enters copy mode with -e (auto-exit when scrolling back to bottom)
bind-key -n WheelUpPane if-shell -F "#{mouse_any_flag}" "send-keys -M" "if -Ft= '#{pane_in_mode}' 'send-keys -M' 'copy-mode -e'"

# Escape exits copy mode instantly
bind-key -T copy-mode Escape send-keys -X cancel


# ----- plugins ---------------------------------------------------------

# ----- Theme config ---------------------------------------------------------
set -g @catppuccin_flavor "mocha"
set -g @catppuccin_window_status_style "rounded"
set -g @catppuccin_window_text " #W "
set -g @catppuccin_window_current_text " #W "
set -g @catppuccin_pane_background_color "#1c2128"
set -g @catppuccin_menu_style "bg=#22272e,fg=#adbac7"
set -g @catppuccin_menu_selected_style "bg=#2d333b,fg=#adbac7"


# Configure status line
set -g status-right-length 100
set -g status-left-length 100
set -g status-left ""
set -g status-right "#{E:@catppuccin_status_application}"
set -ag status-right "#{E:@catppuccin_status_session}"
set -ag status-right "#{E:@catppuccin_status_uptime}"

run "$XDG_CONFIG_HOME/tmux/plugins/catppuccin/tmux/catppuccin.tmux"

# Theme overrides
set -g pane-border-lines heavy
set -g popup-style "bg=#1c2128,fg=#adbac7"
set -g popup-border-style "fg=#444c56"
