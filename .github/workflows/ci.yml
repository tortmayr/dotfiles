name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: install zsh
        run: sudo apt-get update -qq && sudo apt-get install -y -qq zsh

      # Some of these are sourced libraries without a shebang, so shellcheck
      # has to be told the dialect.
      - name: shellcheck
        run: |
          mapfile -t scripts < <(git ls-files '*.sh')
          printf 'checking:\n%s\n' "${scripts[@]}"
          shellcheck --shell=bash "${scripts[@]}"

      # The bin/ scripts predate this repository and carry a backlog of
      # warnings. Gate them on errors only: real breakage fails, the backlog
      # does not block unrelated changes.
      - name: shellcheck (bin, errors only)
        run: |
          mapfile -t scripts < <(git ls-files 'bin/.local/bin/*')
          printf 'checking:\n%s\n' "${scripts[@]}"
          shellcheck --shell=bash --severity=error "${scripts[@]}"

      # This repository is public and several of these files are rewritten by
      # the applications that own them (codex appends [projects."<path>"]
      # entries as you trust directories, for example). An absolute home path
      # is the tell that machine state — possibly a client path — leaked in.
      - name: no host paths
        run: |
          if git grep -nIE '/home/[a-z][a-z0-9_-]*/|/Users/[a-z][a-z0-9_-]*/' \
              -- . ':!README.md' ':!zsh/.config/zsh/.p10k.zsh' ':!codex/.codex/config.toml'; then
            echo "::error::absolute home paths found; this repository is public"
            exit 1
          fi
          echo "no host paths"

      - name: zsh syntax
        run: |
          mapfile -t configs < <(git ls-files '*.zsh' '*/.zshrc' '*/.zshenv')
          printf 'checking:\n%s\n' "${configs[@]}"
          for config in "${configs[@]}"; do
            zsh -n "$config"
          done
