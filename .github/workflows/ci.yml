name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: install zsh
        run: sudo apt-get update -qq && sudo apt-get install -y -qq zsh

      # The *.sh files are sourced libraries without a shebang, so shellcheck
      # has to be told the dialect.
      - name: shellcheck
        run: |
          mapfile -t scripts < <(git ls-files '*.sh')
          printf 'checking:\n%s\n' "${scripts[@]}"
          shellcheck --shell=bash "${scripts[@]}"

      - name: zsh syntax
        run: |
          mapfile -t configs < <(git ls-files '*.zsh' '*/.zshrc' '*/.zshenv')
          printf 'checking:\n%s\n' "${configs[@]}"
          for config in "${configs[@]}"; do
            zsh -n "$config"
          done
